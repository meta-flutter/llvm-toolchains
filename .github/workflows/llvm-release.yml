name: LLVM

on:
  schedule:
    - cron: '0 */8 * * *'
  pull_request:
  push:
    branches:
      - main

env:
  # Oldest LLVM tag to start from (e.g., 16.0.0)
  OLDEST_TAG: "18.0.0"
  # Comma-separated list of tags to skip (e.g., 15.0.0,14.0.0)
  TAGS_TO_SKIP: ""
  # Comma-separated list of only versions to include (skip everything else)
  ONLY_TAGS: "19.1.7"
  # Minimum CMake version required to build LLVM
  MINIMUM_CMAKE_VERSION: "3.20"


permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    outputs:
      llvm_versions: ${{ steps.versions.outputs.llvm_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover LLVM versions
        id: versions
        uses: actions/github-script@v7
        with:
          script: |
            const oldestTag = process.env.OLDEST_TAG || "";
            const tagsToSkip = (process.env.TAGS_TO_SKIP || "").split(',').filter(t => t.trim() !== '');
            const onlyTags = (process.env.ONLY_TAGS || "").split(',').filter(t => t.trim() !== '');
            
            const { data: llvmTags } = await github.rest.repos.listTags({
              owner: 'llvm',
              repo: 'llvm-project',
              per_page: 1000
            });
            
            const { data: ourReleases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1000
            });
            
            // Get existing release tag names
            const existingReleaseTags = ourReleases.map(release => release.tag_name);
            // remove 'llvmorg-' prefix from existing release tags for easier comparison
            existingReleaseTags.filter(tag => tag.startsWith('llvmorg-')).map(tag => tag.substring('llvmorg-'.length));
            
            const llvmVersions = llvmTags
              .map(tag => tag.name)
              .filter(name => name && name.startsWith('llvmorg-') && !name.includes('rc') && !name.includes('final') && !name.includes('init'))
              // check if valid semver
              .filter(name => {
                const version = name.substring('llvmorg-'.length);
                const semverRegex = /^\d+\.\d+\.\d+$/;
                if (!semverRegex.test(version)) {
                  console.log(`Skipping ${name} (not a valid semver)`);
                  return false;
                }
                return true;
              })
              // strip 'llvmorg-' prefix
              .map(name => name.substring('llvmorg-'.length))
              .filter(name => {
                // Skip if already released
                if (existingReleaseTags.includes(name)) {
                  console.log(`Skipping ${name} (already released)`);
                  return false;
                }

                // Filter by only tags
                if (onlyTags.length > 0 && !onlyTags.includes(name)) {
                  console.log(`Skipping ${name} (not in only list)`);
                  return false;
                }

                // Skip specified tags
                if (tagsToSkip.includes(name)) {
                  console.log(`Skipping ${name} (in skip list)`);
                  return false;
                }

                // Filter by oldest tag
                if (oldestTag) {
                  const [major1, minor1, patch1] = oldestTag.split('.').map(Number);
                  const [major2, minor2, patch2] = name.split('.').map(Number);
                  if (major2 < major1 || (major2 === major1 && minor2 < minor1) || (major2 === major1 && minor2 === minor1 && patch2 < patch1)) {
                    console.log(`Skipping ${name} (older than ${oldestTag})`);
                    return false;
                  }
                }

                return true;
              })
              .sort()
              .reverse();
            
            console.log('LLVM versions to build:\n', llvmVersions.map(v => `- ${v}`).join('\n'));
            core.setOutput('llvm_versions', JSON.stringify(llvmVersions));

  build:
    needs: discovery
    strategy:
      fail-fast: false
      matrix:
        llvm_version: ${{ fromJSON(needs.discovery.outputs.llvm_versions) }}
        ubuntu_version: ['20.04', '22.04', '24.04']
        arch: ['x86_64', 'aarch64']
        include:
          - runner: ubuntu-latest
            arch: x86_64
            llvm_arch: x86_64
          - runner: ubuntu-latest-arm64
            arch: aarch64
            llvm_arch: ARM64

    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu_version }}
    
    steps:
      - name: Install build dependencies
        id: install-dependencies
        shell: bash
        run: |
          apt-get update -yq
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            lsb-release \
            wget curl gnupg \
            build-essential \
            ninja-build \
            python3 \
            python3-pip \
            libxml2-dev \
            libedit-dev \
            libncursesw5-dev \
            libffi-dev \
            libz-dev

      - name: Install latest CMake
        id: install-cmake
        shell: bash
        run: |
          # Remove existing CMake if it's too old
          apt remove -yq cmake || true

          ubuntu_release=$(lsb_release -sc)

          # Install CMake from Kitware APT repo to get the specified version
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ $ubuntu_release main" | tee /etc/apt/sources.list.d/kitware.list >/dev/null
          apt-get update -yq
          apt-get install -yq cmake

          # Check if CMake version satisfies constraints
          cmake_version=$(cmake --version | head -n1 | awk '{print $3}')
          echo "Installed CMake version: $cmake_version"
          IFS='.' read -r cmake_major cmake_minor cmake_patch <<< "$cmake_version"
          IFS='.' read -r min_major min_minor min_patch <<< "${{ env.MINIMUM_CMAKE_VERSION }}" 
          if (( cmake_major < min_major )) ||
             (( cmake_major == min_major && cmake_minor < min_minor )) ||
             (( cmake_major == min_major && cmake_minor == min_minor && cmake_patch < min_patch )); then
            echo "CMake version $cmake_version is less than required minimum ${{ env.MINIMUM_CMAKE_VERSION }}"
            exit 1
          else
            echo "CMake version satisfies minimum requirement"
          fi

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-${{ matrix.llvm_version }}

      - name: Setup variables
        id: vars
        shell: bash
        run: |
          # Collect some variables to pass to later steps

          release_binary_basename=llvm-${{ matrix.llvm_version }}-ubuntu_${{ matrix.ubuntu_version }}-${{ matrix.arch }}
          target_cmake_flags="-DBOOTSTRAP_BOOTSTRAP_CPACK_PACKAGE_FILE_NAME=$release_binary_basename"
          build_id=$(date +%s)

          echo "release_binary_basename=$release_binary_basename" >> $GITHUB_OUTPUT
          echo "release_binary_filename=$release_binary_basename.tar.xz" >> $GITHUB_OUTPUT
          echo "target_cmake_flags=$target_cmake_flags" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "build_path=$(pwd)/build" >> $GITHUB_OUTPUT

      - name: Configure build
        id: configure
        shell: bash
        run: |
          cmake -G Ninja -S llvm -B ${{ steps.vars.outputs.build_path }} \
              ${{ steps.vars.outputs.target_cmake_flags }} \
              -C clang/cmake/caches/Release.cmake

      - name: Build
        id: build
        shell: bash
        run: |
          ninja -v -C ${{ steps.vars.outputs.build_path }} stage2-package
          release_dir=`find ${{ steps.vars.outputs.build_path }} -iname 'stage2-bins'`
          mv $release_dir/${{ steps.vars.outputs.release_binary_filename }} .
          # ^ output is .tar.xz

          # Generate SHA256 checksum
          digest=$(cat ${{ steps.vars.outputs.release_binary_filename }} | sha256sum | cut -d ' ' -f 1)
          echo "Built ${{ steps.vars.outputs.release_binary_filename }}\nwith SHA256: $digest\n\n"
          echo "sha256=$digest" >> $GITHUB_OUTPUT

          # write sha to file
          echo "$digest  ${{ steps.vars.outputs.release_binary_filename }}" > ./${{ steps.vars.outputs.release_binary_filename }}.sha256

      # - name: Upload tarball
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ steps.vars.outputs.release_binary_basename }}
      #     path: |
      #       /tmp/llvm-install/${{ steps.vars.outputs.release_binary_filename }}
      #       /tmp/llvm-install/${{ steps.vars.outputs.release_binary_filename }}.sha256
      #     retention-days: 7 # TODO: remove before finishing PR

